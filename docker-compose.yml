version: '3.9'
services:
  db:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: hrm
    ports:
      - '5432:5432'
    volumes:
      - dbdata:/var/lib/postgresql/data
  adminer:
    image: adminer:4.8.1
    ports:
      - '8080:8080'
    depends_on:
      - db
volumes:
  dbdata:
